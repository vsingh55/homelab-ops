---
- name: "Bootstrap Ops-Center (Management Node)"
  hosts: management
  become: true
  vars:
    docker_users: ["devops"]

  tasks:
    # 1. System Hygiene
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: "yes"

    - name: Set system timezone to {{ timezone }}
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Install required system dependencies
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - unzip
          - jq
        state: present

    - name: "System | Enable Auto-FSCK Self-Healing"
      become: true
      # This ensures I don't conflict with Cloud-Init's default config
      copy:
        dest: /etc/default/grub.d/99-self-healing.cfg
        content: |
          # HOMELAB-OPS MANAGED FILE
          # Purpose: Force disk repair on boot to recover from power cuts automatically.
          GRUB_CMDLINE_LINUX_DEFAULT="console=tty1 console=ttyS0 fsck.mode=force fsck.repair=yes"
        mode: '0644'
      notify: update_grub

  handlers:
    - name: update_grub
      become: true
      command: update-grub

    # 2. Docker Installation 
    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Add Docker repository to sources
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
          tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        update_cache: yes
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # 3. User Permissions (Security Best Practice) 
    - name: Add 'devops' user to the docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ docker_users }}"
      
    # n8n Key Deployment- project n8n 
    - name: Authorize n8n Automation Key
      ansible.posix.authorized_key:
        user: devops
        state: present
        key: "{{ n8n_automation_public_key }}"

    # 4. QEMU Guest Agent Installation
    - name: Install QEMU Guest Agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: yes

    - name: Start and Enable QEMU Guest Agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: yes