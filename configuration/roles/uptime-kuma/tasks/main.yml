---
# ==============================================================================
# Tasks for Uptime Kuma Deployment on OCI Instance
# ==============================================================================

- name: Update apt cache and install prerequisite system packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Get system architecture
  ansible.builtin.set_fact:
    dpkg_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Add Docker official repository to apt sources
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and Docker Compose Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add non-root user to docker group
  ansible.builtin.user:
    name: "{{ uptime_kuma_user }}"
    groups: docker
    append: true

- name: Create Uptime Kuma deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_user }}"
    mode: '0755'
  loop:
    - "{{ uptime_kuma_dir }}"
    - "{{ uptime_kuma_dir }}/data"

- name: Deploy Uptime Kuma docker-compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/docker-compose.yml"
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_user }}"
    mode: '0644'

- name: Launch Uptime Kuma container stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ uptime_kuma_dir }}"
  register: compose_result
  changed_when: "'Started' in compose_result.stdout or 'Creating' in compose_result.stdout or 'Recreating' in compose_result.stdout"

- name: Configure UFW firewall rules for SSH and Uptime Kuma
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "{{ uptime_kuma_port }}"

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
