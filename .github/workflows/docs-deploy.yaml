name: Docs Site — Auto Redeploy on Push

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: only fires on paths that affect the docs site output.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "images/**"
      - "process/**"
      - "kubernetes/platform/docs/**"
  workflow_dispatch:

jobs:
  redeploy-docs:
    name: Restart homelab-docs pod
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Join the GitHub runner to your Tailscale network ───────────────
      # The runner becomes an ephemeral Tailscale node (100.x.x.x).
      # After the job finishes the device is automatically removed.
      # Requires two GitHub secrets (see setup guide below):
      #   TS_OAUTH_CLIENT_ID     — from tailscale.com/settings/oauth
      #   TS_OAUTH_CLIENT_SECRET — from tailscale.com/settings/oauth
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest

      # ── 3. Install kubectl ────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      # ── 4. Configure cluster access ───────────────────────────────────────
      # KUBECONFIG secret = your kubeconfig with the Tailscale IP of k3s.
      # Now reachable because the runner is on the same Tailscale network.
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # ── 5. Rolling restart ────────────────────────────────────────────────
      # New pod init-container re-clones repo + rebuilds mkdocs site.
      # Nginx keeps serving old content until the new pod passes readiness.
      - name: Rollout restart homelab-docs
        run: |
          kubectl rollout restart deployment/homelab-docs -n platform

      # ── 6. Wait for completion ────────────────────────────────────────────
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/homelab-docs -n platform --timeout=300s

      # ── 7. Cleanup ────────────────────────────────────────────────────────
      - name: Remove kubeconfig
        if: always()
        run: rm -f $HOME/.kube/config
