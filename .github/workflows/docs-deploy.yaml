name: Docs Site — Auto Redeploy on Push

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: fires on every push to main that touches docs-related paths.
# Scoped paths avoid unnecessary restarts from unrelated commits.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "images/**"
      - "process/**"
      - "kubernetes/platform/docs/**"   # manifest changes also need a restart
  workflow_dispatch:                    # manual trigger from GitHub Actions UI

jobs:
  redeploy-docs:
    name: Restart homelab-docs pod
    runs-on: ubuntu-latest

    # Minimal permissions — cluster access is via secret only
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install kubectl ────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      # ── 3. Configure cluster access from secret ───────────────────────────
      # KUBECONFIG secret = full kubeconfig file content (see README below).
      # GitHub automatically masks all secret values in logs — never printed.
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # ── 4. Rolling restart ────────────────────────────────────────────────
      # Sets a new annotation on the pod template → Kubernetes creates a new pod
      # (init container re-clones repo + rebuilds mkdocs) → terminates old pod.
      # Zero-downtime: nginx stays up serving old content until new pod is ready.
      - name: Rollout restart homelab-docs
        run: |
          kubectl rollout restart deployment/homelab-docs -n platform

      # ── 5. Wait for rollout and report status ─────────────────────────────
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/homelab-docs -n platform --timeout=300s

      # ── 6. Cleanup — always remove kubeconfig from runner disk ────────────
      - name: Remove kubeconfig
        if: always()
        run: rm -f $HOME/.kube/config
