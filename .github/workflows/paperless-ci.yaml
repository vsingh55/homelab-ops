name: Build, Scan, Sign, and Push Image

on:
  push:
    branches: ["main"]
    paths:
      - "apps/paperless-custom/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/paperless-custom

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for pushing to GHCR
      security-events: write # Required for uploading Trivy results
      id-token: write # Required for keyless signing via OIDC

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. SonarQube Scan for Code Quality
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: apps/paperless-custom

      # 2. Build Image (Locally inside the runner to scan before pushing)
      - name: Build Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/paperless-custom
          load: true # Load into runner so Trivy can scan it
          tags: local-paperless:latest

      # 3. Security Scan (Trivy) - Fails pipeline if Critical/High Vulns found
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local-paperless:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 4. Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Push Image to GHCR
      - name: Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./apps/paperless-custom
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Install Cosign & Keyless Sign the Image using GitHub OIDC
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published Docker image
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
