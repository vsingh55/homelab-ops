name: Renovate Autonomous Workload Sysadmin

on:
  schedule:
    # Run every Monday at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate Log Level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate Dependency & Image Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Self-Hosted Renovate
        uses: renovatebot/github-action@v41.0.14
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
