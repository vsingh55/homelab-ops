# 1. The Firewall Rule: Block EVERYTHING in 'automation' namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: automation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Ingress: Allow Traefik -> n8n (So you can access the UI)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-n8n
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: n8n
  ingress:
    #1. Allow Traefik (UI Access)
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5678
    #2. Allow Grafana (Monitoring) -> n8n
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5678
---
# 3. Egress: Allow n8n -> Postgres AND n8n -> DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-n8n-egress
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: n8n
  egress:
    # Rule A: Allow connection to Postgres DB
    - to:
      - podSelector:
          matchLabels:
            app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Rule B: Allow DNS Lookups (Essential for finding "postgres")
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Rule C: Allow Internet Access (HTTPS/HTTP)
    # Required for: Gemini, PostHog, GitHub, APIs
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 192.168.0.0/16  
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Rule D: Allow SSH for Remediation (Port 22)
    - to:
      # Allow SSH to Local Infrastructure (Proxmox/VMs)
      - ipBlock:
          cidr: 192.168.0.0/16
      # Allow SSH to Public Infrastructure (GCP)
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 22
---
# 4. Ingress: Allow Postgres <- n8n
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: n8n
      ports:
        - protocol: TCP
          port: 5432