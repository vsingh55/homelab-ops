apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-pdf-generator
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: pdf-generator
  ingress:
    # Allow Traefik (running in kube-system) to access the Web Portal on port 5000
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pdf-generator-egress
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: pdf-generator
  egress:
    # Allow DNS Lookups to kube-system
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
