apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-alerts
  namespace: monitoring 
  labels:
    release: monitoring 
spec:
  groups:
  - name: velero.rules
    rules:
    # 1. Backup Failed (Critical)
    - alert: VeleroBackupFailed
      expr: velero_backup_failure_total > 0
      for: 5m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Velero Backup Failed"
        description: "Backup failure detected in k3s-prod. Check Velero logs immediately."

    # 2. Backup Stale (Warning - No backup in 25 hours)
    - alert: VeleroBackupStale
      expr: (time() - velero_backup_last_successful_timestamp) > 90000
      labels:
        severity: warning
        component: backup
      annotations:
        summary: "Velero Backup Stale"
        description: "No successful backup recorded in the last 25 hours."