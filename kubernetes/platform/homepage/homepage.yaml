apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: platform
data:
  settings.yaml: |
    title: "Vijay Singh | Homelab Command Center"
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Operations & Automation:
        style: row
        columns: 2
      Platform & Observability:
        style: row
        columns: 2
      Infrastructure & Management:
        style: row
        columns: 2

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: "Sovereign Cloud Homelab"
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showNodes: true
        nodes:
          show: true
          cpu: true
          memory: true

  kubernetes.yaml: |
    mode: cluster

  services.yaml: |
    - Operations & Automation:
        - n8n Workflow Automation:
            icon: n8n.png
            href: https://hooks.vijaysingh.cloud
            description: "Event-driven workflow orchestration & self-healing automation"
            ping: https://hooks.vijaysingh.cloud
        - PDF Document Generator:
            icon: python.png
            href: https://pdf.vijaysingh.cloud
            description: "Automated document compilation & Python microservice"
            ping: https://pdf.vijaysingh.cloud

    - Platform & Observability:
        - Architecture & Engineering Docs:
            icon: book-open-page-variant.png
            href: https://docs.vijaysingh.cloud
            description: "Engineering handbook, ADRs, post-mortems & execution phases"
            ping: https://docs.vijaysingh.cloud
        - Cluster Telemetry (Grafana):
            icon: grafana.png
            href: https://telemetry.vijaysingh.cloud
            description: "Full-stack cluster observability, Prometheus metrics & telemetry"
            ping: https://telemetry.vijaysingh.cloud

    - Infrastructure & Management:
        - Homelab GitOps Repository:
            icon: github.png
            href: https://github.com/vsingh55/homelab-ops
            description: "Infrastructure as Code (Terraform, Ansible, K8s GitOps)"
        - Cloudflare Zero Trust Edge:
            icon: cloudflare.png
            href: https://one.dash.cloudflare.com
            description: "Anycast edge routing, DDoS shield & QUIC tunnel connectors"

  bookmarks.yaml: |
    - Quick Access:
        - GitHub Profile:
            - icon: github.png
              href: https://github.com/vsingh55
        - Proxmox VE:
            - icon: proxmox.png
              href: https://192.168.1.3:8006
        - Tailscale Admin:
            - icon: tailscale.png
              href: https://login.tailscale.com/admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: platform
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      volumes:
        - name: config-storage
          emptyDir: {}
        - name: config-source
          configMap:
            name: homepage-config
      initContainers:
        - name: copy-config
          image: busybox:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /config-source/* /app/config/
              mkdir -p /app/config/logs
          volumeMounts:
            - name: config-storage
              mountPath: /app/config
            - name: config-source
              mountPath: /config-source
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "hub.vijaysingh.cloud,localhost:3000,127.0.0.1:3000"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config-storage
              mountPath: /app/config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: platform
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: platform
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: hub.vijaysingh.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
