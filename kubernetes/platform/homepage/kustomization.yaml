apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: homepage-config
    files:
      - config/settings.yaml
      - config/widgets.yaml
      - config/kubernetes.yaml
      - config/services.yaml
      - config/bookmarks.yaml
      - config/custom.css
    options:
      disableNameSuffixHash: true
