apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-notifications
  namespace: monitoring
  labels:
    alertmanagerConfig: homelab
spec:
  route:
    groupBy: ['job', 'alertname', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'slack-infra-monitoring'
  receivers:
  - name: 'slack-infra-monitoring'
    slackConfigs:
    - channel: '#infra-monitoring'
      sendResolved: true
      apiURL:
        name: alertmanager-slack-webhook
        key: url
