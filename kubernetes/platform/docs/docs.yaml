apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mkdocs-config
  namespace: platform
data:
  mkdocs.yml: |
    site_name: "Vijay Singh | Homelab Ops & Platform Engineering"
    site_description: "Production Homelab, Hybrid Cloud Architecture, Disaster Recovery & FinOps Engineering Handbook"
    site_author: "Vijay Singh"
    repo_url: "https://github.com/vsingh55/homelab-ops"
    repo_name: "vsingh55/homelab-ops"

    theme:
      name: material
      palette:
        - scheme: default
          primary: indigo
          accent: deep purple
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: deep purple
          toggle:
            icon: material/brightness-4
            name: Switch to light mode
      features:
        - navigation.instant
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy

    markdown_extensions:
      - admonition
      - md_in_html
      - pymdownx.details
      - pymdownx.superfences:
          custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
      - pymdownx.highlight
      - pymdownx.inlinehilite
      - tables
      - attr_list

    nav:
      - "Overview": index.md
      - "System Architecture":
          - "01. System Overview": architecture/01-system-overview.md
          - "02. Hardware & Virtualization": architecture/02-hardware-and-virtualization.md
          - "03. Kubernetes & K3s Cluster": architecture/03-kubernetes-k3s-cluster.md
          - "04. Zero-Trust Networking": architecture/04-zero-trust-networking.md
          - "05. Dual-Tier Storage": architecture/05-dual-tier-storage.md
      - "Featured Projects (Case Studies)":
          - "01. Zero-Trust Hybrid Ingress": projects/01-zero-trust-ingress.md
          - "02. GitOps & In-Git Secrets": projects/02-gitops-and-sops.md
          - "03. Stateful PostgreSQL HA": projects/03-cloudnativepg-ha.md
          - "04. Multi-Cloud Resilience & DR": projects/04-multicloud-observability-dr.md
      - "Architecture Decisions (ADRs)":
          - "Enterprise ADR Register": adr/README.md
      - "Execution Phases":
          - "Execution Master Index": execution-phases/README.md
          - "01. Architecture Baseline": execution-phases/01-architecture-baseline.md
          - "02. Codebase Pruning": execution-phases/02-codebase-pruning.md
          - "03. Remote State Migration": execution-phases/03-remote-state-migration.md
          - "04. Hypervisor Consolidation": execution-phases/04-proxmox-consolidation.md
          - "05. Edge Ingress & Registry": execution-phases/05-edge-ingress-and-registry.md
          - "06. GitOps & SOPS Secrets": execution-phases/06-gitops-bootstrap-sops.md
          - "07. Fleet Deployment & ChatOps": execution-phases/07-application-fleet-deployment.md
      - "Operations & Runbooks":
          - "Backup & Disaster Recovery": runbooks/01-backup-and-disaster-recovery.md
          - "Day-2 Cluster Operations": runbooks/02-cluster-operations.md
      - "Engineering Archive (v1 & v2)":
          - "Archive Overview": archive/README.md
          - "Milestone v1.0 (Bare Metal & LXC)": archive/v1-legacy-baremetal-foundation.md
          - "Milestone v2.0 (Hybrid Cloud Relay)": archive/v2-legacy-hybrid-cloud-relay.md
          - "Incident: Boot Failure Recovery": archive/post-mortems/01-debugging-boot-failure.md
          - "Incident: WAN Connectivity": archive/post-mortems/02-debugging-wan-connectivity.md
          - "Challenges: Early Infrastructure": archive/post-mortems/03-infrastructure-challenges.md
          - "Journey: Ansible Automation Fleet": archive/post-mortems/04-ansible-automation-journey.md
          - "Journey: Terraform Modularization": archive/post-mortems/05-terraform-modularization.md
          - "Deep-Dive: In-Memory Secret Hydration": archive/post-mortems/06-legacy-secret-hydration.md
          - "Journal: Hybrid Cloud Automation (n8n)": archive/post-mortems/07-hybrid-cloud-automation-n8n.md
          - "Journal: Self-Healing VPN Watchdog": archive/post-mortems/08-self-healing-watchdog.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-docs
  namespace: platform
  labels:
    app.kubernetes.io/name: homelab-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-docs
    spec:
      volumes:
      - name: shared-site
        emptyDir: {}
      - name: config-volume
        configMap:
          name: mkdocs-config
      initContainers:
      - name: git-clone-and-build
        image: squidfunk/mkdocs-material:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "Cloning repository..."
          git clone --depth 1 https://github.com/vsingh55/homelab-ops.git /tmp/repo
          cd /tmp/repo
          cp /config/mkdocs.yml /tmp/repo/mkdocs.yml
          cp -r /tmp/repo/images /tmp/repo/docs/images 2>/dev/null || true
          if [ ! -f /tmp/repo/docs/index.md ]; then
            cp /tmp/repo/README.md /tmp/repo/docs/index.md
          fi
          echo "Building static MkDocs site..."
          mkdocs build -d /site
          echo "Build complete. Static assets ready in /site."
        volumeMounts:
        - name: shared-site
          mountPath: /site
        - name: config-volume
          mountPath: /config
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: shared-site
          mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-docs
  namespace: platform
  labels:
    app.kubernetes.io/name: homelab-docs
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: homelab-docs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelab-docs-ingress
  namespace: platform
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: docs.vijaysingh.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homelab-docs
            port:
              number: 80
