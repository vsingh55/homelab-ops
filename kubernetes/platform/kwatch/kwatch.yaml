apiVersion: v1
kind: Namespace
metadata:
  name: kwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwatch
  namespace: kwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwatch
rules:
- apiGroups: [""]
  resources: ["events", "pods", "pods/log", "namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes", "configmaps"]
  verbs: ["get", "watch", "list", "create", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwatch
subjects:
- kind: ServiceAccount
  name: kwatch
  namespace: kwatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwatch
  namespace: kwatch
  labels:
    app.kubernetes.io/name: kwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kwatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwatch
    spec:
      serviceAccountName: kwatch
      containers:
      - name: kwatch
        image: ghcr.io/abahmed/kwatch:v0.10.5
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: config-volume
          mountPath: /config
        env:
        - name: CONFIG_FILE
          value: "/config/config.yaml"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config-volume
        secret:
          secretName: kwatch-config
