apiVersion: v1
kind: Namespace
metadata:
  name: productivity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: productivity
  labels:
    app.kubernetes.io/name: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      containers:
      - name: miniflux
        image: miniflux/miniflux:latest
        env:
        - name: DATABASE_URL
          value: "postgres://n8n:ChangeMeToSomethingStrong123!@postgres-ha-rw.database.svc.cluster.local:5432/n8n?sslmode=disable"
        - name: RUN_MIGRATIONS
          value: "1"
        - name: ADMIN_USERNAME
          value: "admin"
        - name: ADMIN_PASSWORD
          value: "ChangeMeMiniflux123!"
        - name: BASE_URL
          value: "https://rss.vijaysingh.cloud"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: productivity
  labels:
    app.kubernetes.io/name: miniflux
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: miniflux
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux-ingress
  namespace: productivity
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: rss.vijaysingh.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miniflux
            port:
              number: 80
