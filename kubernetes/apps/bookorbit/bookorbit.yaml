apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hdd
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: media
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
    spec:
      containers:
      - name: bookorbit
        image: docker.io/jvmilazz0/kavita:latest
        env:
        - name: TZ
          value: "Asia/Kolkata"
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: storage
          mountPath: /kavita/config
          subPath: config
        - name: storage
          mountPath: /books
          subPath: library
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: bookorbit-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bookorbit
  namespace: media
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app.kubernetes.io/name: bookorbit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookorbit-ingress
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: books.vijaysingh.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bookorbit
            port:
              number: 5000
