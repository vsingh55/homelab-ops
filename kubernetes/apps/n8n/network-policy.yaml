apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-n8n-egress
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app: n8n
  policyTypes:
  - Egress
  egress:
  # Allow PostgreSQL connection to CloudNativePG in database namespace
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database
    - podSelector:
        matchLabels:
          app: postgres
  # Allow DNS queries
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # Allow outbound HTTP and HTTPS for webhooks and APIs
  - ports:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
